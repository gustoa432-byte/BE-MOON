<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 380" fill="none">
  <defs>
    <!-- Cinematic Rim Light Gradient matching BE'MOON Emerald Aura -->
    <linearGradient id="rim_vortex" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#34d399" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Torso Depth Gradient -->
    <linearGradient id="body_vortex" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#11141c"/>
      <stop offset="60%" stop-color="#0c0d12"/>
      <stop offset="100%" stop-color="#060709"/>
    </linearGradient>

    <!-- Face Skin Gradient -->
    <linearGradient id="skin_vortex" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#d9a07a"/>
      <stop offset="100%" stop-color="#996847"/>
    </linearGradient>

    <!-- Hair Depth Gradient -->
    <linearGradient id="hair_vortex" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2029"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </linearGradient>

    <!-- Inner Glow Filter -->
    <filter id="auraGlow_vortex" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 1. Aura Edge Rim Light (Contour) -->
  <path d="M70 380 C70 290 85 240 115 220 C105 205 95 180 95 150 C95 90 120 70 160 70 C200 70 225 90 225 150 C225 180 215 205 205 220 C235 240 250 290 250 380 Z"
        stroke="url(#rim_vortex)" stroke-width="2.5" stroke-opacity="0.6" fill="none" filter="url(#auraGlow_vortex)"/>

  <!-- 2. Torso / Shoulders -->
  <path d="M45 380 C45 300 75 250 115 230 L160 250 L205 230 C245 250 275 300 275 380 Z"
        fill="url(#body_vortex)" />

  <!-- Clothing Collar / Details -->
  <path d="M125 235 L160 275 L195 235" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="2" fill="none" />

  

  <!-- 3. Neck -->
  <path d="M138 200 L138 245 L182 245 L182 200 Z" fill="url(#skin_vortex)" opacity="0.9" />

  <!-- 4. Head & Face -->
  <ellipse cx="160" cy="155" rx="44" ry="52" fill="url(#skin_vortex)" />

  <!-- Jawline Shadow for depth -->
  <path d="M125 165 C135 195 185 195 195 165 C185 205 135 205 125 165 Z" fill="#000000" opacity="0.25" />

  <!-- 5. Eyes & Eyebrows (Minimalist Editorial Look) -->
  <path d="M136 142 Q144 140 152 143" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M168 143 Q176 140 184 142" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="144" cy="151" r="3" fill="#111827"/>
  <circle cx="176" cy="151" r="3" fill="#111827"/>
  <!-- Light catch in eyes -->
  <circle cx="145" cy="150" r="1" fill="#fff"/>
  <circle cx="177" cy="150" r="1" fill="#fff"/>

  <!-- Nose -->
  <path d="M160 148 L158 165 L164 167" stroke="#78482d" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- Lips / Mouth -->
  <path d="M150 178 Q160 182 170 178" stroke="#874735" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.75"/>

  <!-- 6. Beard (if applicable) -->
  
    <path d="M124 155 C124 195 140 215 160 215 C180 215 196 195 196 155 C190 190 170 198 160 198 C150 198 130 190 124 155 Z"
          fill="url(#hair_vortex)" opacity="0.95" />
    <path d="M144 172 Q160 168 176 172" stroke="#1e2029" stroke-width="3" stroke-linecap="round" fill="none"/>
  

  <!-- 7. Hair Styles -->
  
    <!-- Classic Natural Silhouette Hair -->
    <path d="M116 145 C116 95 130 80 160 80 C190 80 204 95 204 145 C195 120 180 110 160 110 C140 110 125 120 116 145 Z" fill="url(#hair_vortex)"/>
  

  <!-- 8. Subtle Rim Light Glow on Hair & Shoulders -->
  <path d="M118 130 C120 90 135 80 160 80" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-opacity="0.85" fill="none"/>
  <path d="M60 370 C65 310 95 260 125 240" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-opacity="0.7" fill="none"/>

  <!-- 9. Cinematic Soft Bottom Dissolve into transparent void -->
  <rect x="0" y="330" width="320" height="50" fill="url(#bottomFade)" opacity="0.9" />
  <defs>
    <linearGradient id="bottomFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0e12" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0d0e12" stop-opacity="1"/>
    </linearGradient>
  </defs>
</svg>