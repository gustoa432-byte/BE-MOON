<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 380" fill="none">
  <defs>
    <!-- Cinematic Rim Light Gradient matching BE'MOON Emerald Aura -->
    <linearGradient id="rim_alina" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#34d399" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Torso Depth Gradient -->
    <linearGradient id="body_alina" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c2826"/>
      <stop offset="60%" stop-color="#0c0d12"/>
      <stop offset="100%" stop-color="#060709"/>
    </linearGradient>

    <!-- Face Skin Gradient -->
    <linearGradient id="skin_alina" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#996847"/>
    </linearGradient>

    <!-- Hair Depth Gradient -->
    <linearGradient id="hair_alina" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </linearGradient>

    <!-- Inner Glow Filter -->
    <filter id="auraGlow_alina" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 1. Aura Edge Rim Light (Contour) -->
  <path d="M70 380 C70 290 85 240 115 220 C105 205 95 180 95 150 C95 90 120 70 160 70 C200 70 225 90 225 150 C225 180 215 205 205 220 C235 240 250 290 250 380 Z"
        stroke="url(#rim_alina)" stroke-width="2.5" stroke-opacity="0.6" fill="none" filter="url(#auraGlow_alina)"/>

  <!-- 2. Torso / Shoulders -->
  <path d="M45 380 C45 300 75 250 115 230 L160 250 L205 230 C245 250 275 300 275 380 Z"
        fill="url(#body_alina)" />

  <!-- Clothing Collar / Details -->
  <path d="M125 235 L160 275 L195 235" stroke="#10b981" stroke-opacity="0.4" stroke-width="2" fill="none" />

  
    <!-- Artisan Apron bib & straps -->
    <path d="M110 270 L210 270 L220 380 L100 380 Z" fill="#1b1e28" opacity="0.85"/>
    <line x1="120" y1="230" x2="135" y2="270" stroke="#10b981" stroke-width="3" stroke-opacity="0.7"/>
    <line x1="200" y1="230" x2="185" y2="270" stroke="#10b981" stroke-width="3" stroke-opacity="0.7"/>
    <rect x="135" y="300" width="50" height="40" rx="4" fill="#12141c" stroke="#ffffff" stroke-opacity="0.1"/>
  

  <!-- 3. Neck -->
  <path d="M138 200 L138 245 L182 245 L182 200 Z" fill="url(#skin_alina)" opacity="0.9" />

  <!-- 4. Head & Face -->
  <ellipse cx="160" cy="155" rx="44" ry="52" fill="url(#skin_alina)" />

  <!-- Jawline Shadow for depth -->
  <path d="M125 165 C135 195 185 195 195 165 C185 205 135 205 125 165 Z" fill="#000000" opacity="0.25" />

  <!-- 5. Eyes & Eyebrows (Minimalist Editorial Look) -->
  <path d="M136 142 Q144 140 152 143" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M168 143 Q176 140 184 142" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="144" cy="151" r="3" fill="#111827"/>
  <circle cx="176" cy="151" r="3" fill="#111827"/>
  <!-- Light catch in eyes -->
  <circle cx="145" cy="150" r="1" fill="#fff"/>
  <circle cx="177" cy="150" r="1" fill="#fff"/>

  <!-- Nose -->
  <path d="M160 148 L158 165 L164 167" stroke="#78482d" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- Lips / Mouth -->
  <path d="M150 178 Q160 182 170 178" stroke="#874735" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.75"/>

  <!-- 6. Beard (if applicable) -->
  

  <!-- 7. Hair Styles -->
  
    <!-- Flowing Hair Waves -->
    <path d="M112 165 C108 115 124 80 160 80 C196 80 212 115 208 165 C215 195 210 240 202 270 C195 215 200 135 160 135 C120 135 125 215 118 270 C110 240 105 195 112 165 Z" fill="url(#hair_alina)"/>
  

  <!-- 8. Subtle Rim Light Glow on Hair & Shoulders -->
  <path d="M118 130 C120 90 135 80 160 80" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-opacity="0.85" fill="none"/>
  <path d="M60 370 C65 310 95 260 125 240" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-opacity="0.7" fill="none"/>

  <!-- 9. Cinematic Soft Bottom Dissolve into transparent void -->
  <rect x="0" y="330" width="320" height="50" fill="url(#bottomFade)" opacity="0.9" />
  <defs>
    <linearGradient id="bottomFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0e12" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0d0e12" stop-opacity="1"/>
    </linearGradient>
  </defs>
</svg>